name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '5 16 * * *'
  workflow_dispatch:

concurrency:
  group: production-index-sync
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Astro check (import/D0)
        run: pnpm astro check --minimumSeverity error

      - name: Check post references
        run: pnpm check:references

      - name: Build
        run: pnpm build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Generate SEO/AEO observability reports
        run: |
          pnpm content:ops
          pnpm seo:freshness
          pnpm seo:observe -- --fetch-gsc --fetch-ga4
        env:
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
          GSC_ACCESS_TOKEN: ${{ secrets.GSC_ACCESS_TOKEN }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          GA4_ACCESS_TOKEN: ${{ secrets.GA4_ACCESS_TOKEN }}

      - name: Upload SEO/AEO observability reports
        uses: actions/upload-artifact@v4
        with:
          name: seo-aeo-observability
          path: |
            docs/content-ops-report.json
            docs/seo-freshness-priorities.json
            docs/seo-freshness-priorities.md
            docs/seo-observability-report.json
          if-no-files-found: error

      - name: Apply D1 migrations
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4"
          command: d1 migrations apply quidproquo-db --remote

      - name: Deploy to production
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4"
          command: deploy --config dist/server/wrangler.json

      - name: Sync posts to production D1
        run: pnpm sync:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Sync post embeddings
        run: pnpm sync:embeddings:prod
        env:
          CRAWL_SECRET: ${{ secrets.CRAWL_SECRET }}
          WORKER_URL: https://quidproquo.cc

      - name: Verify production search freshness
        run: pnpm check:search-freshness
        env:
          SEARCH_FRESHNESS_BASE_URL: https://quidproquo.cc
