name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "5 16 * * *"
  workflow_dispatch:

jobs:
  detect-content-index:
    name: Detect content index changes
    runs-on: ubuntu-latest
    outputs:
      should_sync: ${{ steps.content-index.outputs.should_sync }}
      reason: ${{ steps.content-index.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: content-index
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should_sync=true" >> "$GITHUB_OUTPUT"
            echo "reason=$EVENT_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "should_sync=true" >> "$GITHUB_OUTPUT"
            echo "reason=missing-before-sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_files="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- \
            src/content/posts \
            docs/rag-golden-fixture.json \
            docs/rag-golden-dataset.json \
            migrations \
            scripts/sync-to-d1.ts \
            scripts/sync-embeddings-prod.mjs \
            src/lib/crawl/chunker.ts \
            src/lib/indexing \
            src/lib/retrieval/embedding.ts \
            src/pages/api/embed/sync.ts \
            src/pages/api/index/posts/sync.ts)"
          if [[ -n "$changed_files" ]]; then
            echo "should_sync=true" >> "$GITHUB_OUTPUT"
            echo "reason=content-index-inputs-changed" >> "$GITHUB_OUTPUT"
          else
            echo "should_sync=false" >> "$GITHUB_OUTPUT"
            echo "reason=no-content-index-inputs-changed" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Quality gate
    uses: ./.github/workflows/quality.yml

  seo-observability:
    name: SEO observability
    needs: [detect-content-index]
    if: needs.detect-content-index.outputs.should_sync == 'true'
    uses: ./.github/workflows/seo-observability.yml
    secrets: inherit

  # Build and quality are independent before deploy: the site has ~15k static
  # pages (~11 min) while pnpm verify takes ~4 min. Splitting them removes the
  # verify time from the deploy critical path. Deploy still requires both.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.3
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # node_modules/.astro 存的是 Markdown 渲染結果；文章沒改就沿用。前綴要涵蓋
      # 渲染管線本身（remark/rehype 外掛、外掛 import 的資料檔、套件版本），否則
      # 改了外掛但文章沒動，部署出去仍是舊 HTML（2026-10-23 路線影片表 colgroup 事件）。
      # 外掛新增 import 的資料檔時，一併加進下面的 hashFiles。
      # 不留跨前綴的 restore-key：渲染管線變了就整份重建，不拿舊管線的結果。
      - name: Restore Astro build cache
        uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: ${{ runner.os }}-astro-v2-${{ hashFiles('astro.config.mjs', 'pnpm-lock.yaml', 'src/plugins/**', 'src/data/climbing-videos.ts') }}-${{ hashFiles('src/content/**/*.md') }}
          restore-keys: |
            ${{ runner.os }}-astro-v2-${{ hashFiles('astro.config.mjs', 'pnpm-lock.yaml', 'src/plugins/**', 'src/data/climbing-videos.ts') }}-
      - name: Restore OG image cache
        uses: actions/cache@v6
        with:
          path: .cache/og-images
          key: >-
            ${{ runner.os }}-og-v2-${{ hashFiles('scripts/generate-og-images.mjs', 'public/fonts/NotoSansTC-Medium.otf', 'public/favicon.svg') }}-${{ hashFiles('src/content/posts/**/*.md') }}
          restore-keys: |
            ${{ runner.os }}-og-v2-${{ hashFiles('scripts/generate-og-images.mjs', 'public/fonts/NotoSansTC-Medium.otf', 'public/favicon.svg') }}-
            ${{ runner.os }}-og-
      - name: Build
        run: pnpm build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 1

  # `wrangler deploy` rebuilds the sandbox image from sandbox/Dockerfile on
  # every deploy (~2.3 min). Build/push it here in parallel and give the deploy
  # step a registry reference instead, so the image work is off the critical
  # path. The tag is derived from the Dockerfile hash so each deploy uses the
  # image that matches the source being deployed.
  sandbox-image:
    name: Build sandbox image
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.build.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.3
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and push image
        id: build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          dockerfile_hash="${{ hashFiles('sandbox/Dockerfile') }}"
          image_tag="quidproquo-sandbox:${dockerfile_hash:0:12}"
          output_file="$(mktemp)"
          npx wrangler containers build ./sandbox --tag "$image_tag" --push 2>&1 | tee "$output_file"
          # wrangler prints both a tagged ref ("pushing: ...:tag") and an
          # untagged repository ("repository [.../image]"). Only the tagged
          # one is deployable, so take the first match containing ':'. When the
          # image is already remote there may be no tagged line at all; build
          # the ref from the same tag/account instead of failing the deploy.
          image_ref="$(grep -oE 'registry\.cloudflare\.com/[A-Za-z0-9_./:@-]+' "$output_file" | grep ':' | head -1 || true)"
          if [[ -z "$image_ref" ]]; then
            account_id="$(grep -oE '"account_id"[[:space:]]*:[[:space:]]*"[a-f0-9]+"' wrangler.jsonc | grep -oE '[a-f0-9]{32}' | head -1)"
            image_ref="registry.cloudflare.com/${account_id}/${image_tag}"
            echo "tagged ref not found in output; using ${image_ref}"
          fi
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"

  deploy-worker:
    name: Deploy production Worker
    needs: [quality, build, sandbox-image]
    if: needs.quality.result == 'success' && needs.build.result == 'success' && needs.sandbox-image.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: production-worker-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      # wrangler-action runs `npx --no-install wrangler`; without node_modules it
      # falls back to `npm i wrangler@4`, which hits ERESOLVE against the repo's
      # pnpm peer-dependency graph. Keep the install so the action finds wrangler.
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.3
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      - name: Use pre-built sandbox image
        env:
          SANDBOX_IMAGE_REF: ${{ needs.sandbox-image.outputs.image_ref }}
        run: node scripts/apply-sandbox-image.mjs
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4"
          command: d1 migrations apply quidproquo-db --remote
      - name: Deploy to production
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4"
          command: deploy --config dist/server/wrangler.json

  content-index:
    name: Update production content index
    needs: [detect-content-index, deploy-worker]
    if: needs.detect-content-index.outputs.should_sync == 'true' && needs.deploy-worker.result == 'success'
    uses: ./.github/workflows/content-index.yml
    with:
      worker_url: https://quidproquo.cc
      embedding_max_batches: 20
      lock_group: production-index-sync
    secrets: inherit
