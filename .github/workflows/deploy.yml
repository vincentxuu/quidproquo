name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "5 16 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  detect-content-index:
    name: Detect content index changes
    runs-on: ubuntu-latest
    outputs:
      should_sync: ${{ steps.content-index.outputs.should_sync }}
      reason: ${{ steps.content-index.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: content-index
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should_sync=true" >> "$GITHUB_OUTPUT"
            echo "reason=$EVENT_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "should_sync=true" >> "$GITHUB_OUTPUT"
            echo "reason=missing-before-sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_files="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- \
            src/content/posts \
            docs/rag-golden-fixture.json \
            docs/rag-golden-dataset.json \
            migrations \
            scripts/sync-to-d1.ts \
            scripts/sync-embeddings-prod.mjs \
            src/lib/crawl/chunker.ts \
            src/lib/indexing \
            src/lib/retrieval/embedding.ts \
            src/pages/api/embed/sync.ts \
            src/pages/api/index/posts/sync.ts)"
          if [[ -n "$changed_files" ]]; then
            echo "should_sync=true" >> "$GITHUB_OUTPUT"
            echo "reason=content-index-inputs-changed" >> "$GITHUB_OUTPUT"
          else
            echo "should_sync=false" >> "$GITHUB_OUTPUT"
            echo "reason=no-content-index-inputs-changed" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Quality gate
    uses: ./.github/workflows/quality.yml

  seo-observability:
    name: SEO observability
    needs: [detect-content-index]
    if: needs.detect-content-index.outputs.should_sync == 'true'
    uses: ./.github/workflows/seo-observability.yml
    secrets: inherit

  deploy-worker:
    name: Deploy production Worker
    needs: [detect-content-index, quality, seo-observability]
    if: >-
      always() &&
      needs.quality.result == 'success' &&
      (needs.seo-observability.result == 'success' || needs.seo-observability.result == 'skipped')
    runs-on: ubuntu-latest
    concurrency:
      group: production-worker-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore OG image cache
        uses: actions/cache@v4
        with:
          path: .cache/og-images
          key: >-
            ${{ runner.os }}-og-v2-${{ hashFiles('scripts/generate-og-images.mjs', 'public/fonts/NotoSansTC-Medium.otf', 'public/favicon.svg') }}-${{ hashFiles('src/content/posts/**/*.md') }}
          restore-keys: |
            ${{ runner.os }}-og-v2-${{ hashFiles('scripts/generate-og-images.mjs', 'public/fonts/NotoSansTC-Medium.otf', 'public/favicon.svg') }}-
            ${{ runner.os }}-og-
      - name: Build
        run: pnpm build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4"
          command: d1 migrations apply quidproquo-db --remote
      - name: Deploy to production
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4"
          command: deploy --config dist/server/wrangler.json

  content-index:
    name: Update production content index
    needs: [detect-content-index, deploy-worker]
    if: needs.detect-content-index.outputs.should_sync == 'true' && needs.deploy-worker.result == 'success'
    uses: ./.github/workflows/content-index.yml
    with:
      worker_url: https://quidproquo.cc
      embedding_max_batches: 20
      lock_group: production-index-sync
    secrets: inherit
