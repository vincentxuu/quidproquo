name: Preview

on:
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality gate
    uses: ./.github/workflows/quality.yml

  preview:
    name: Build and deploy preview
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # node_modules/.astro 存的是 Markdown 渲染結果；文章沒改就沿用。前綴要涵蓋
      # 渲染管線本身（remark/rehype 外掛、外掛 import 的資料檔、套件版本），否則
      # 改了外掛但文章沒動，部署出去仍是舊 HTML（2026-10-23 路線影片表 colgroup 事件）。
      # 外掛新增 import 的資料檔時，一併加進下面的 hashFiles。
      # 不留跨前綴的 restore-key：渲染管線變了就整份重建，不拿舊管線的結果。
      - name: Restore Astro build cache
        uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: ${{ runner.os }}-astro-v2-${{ hashFiles('astro.config.mjs', 'pnpm-lock.yaml', 'src/plugins/**', 'src/data/climbing-videos.ts') }}-${{ hashFiles('src/content/**/*.md') }}
          restore-keys: |
            ${{ runner.os }}-astro-v2-${{ hashFiles('astro.config.mjs', 'pnpm-lock.yaml', 'src/plugins/**', 'src/data/climbing-videos.ts') }}-
      - name: Restore OG image cache
        uses: actions/cache@v6
        with:
          path: .cache/og-images
          key: >-
            ${{ runner.os }}-og-v2-${{ hashFiles('scripts/generate-og-images.mjs', 'public/fonts/NotoSansTC-Medium.otf', 'public/favicon.svg') }}-${{ hashFiles('src/content/posts/**/*.md') }}
          restore-keys: |
            ${{ runner.os }}-og-v2-${{ hashFiles('scripts/generate-og-images.mjs', 'public/fonts/NotoSansTC-Medium.otf', 'public/favicon.svg') }}-
            ${{ runner.os }}-og-
      - name: Build
        run: pnpm build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4"
          command: deploy --config dist/server/wrangler.json --env preview
      - name: Comment preview URL
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview: ${{ steps.deploy.outputs.deployment-url }}`
            })
