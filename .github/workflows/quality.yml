name: Quality

on:
  workflow_call:

jobs:
  ui-scope:
    name: Detect UI changes
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test UI scope detection
        run: node --test scripts/ui-change-scope.test.mjs
      - id: scope
        name: Detect affected UI
        env:
          UI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          UI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ui-change-scope.mjs >> "$GITHUB_OUTPUT"

  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify (lint + references + skills-sync + progress)
        run: pnpm verify

  rag-eval:
    name: Promptfoo RAG contract (non-blocking)
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir evals/rag install --frozen-lockfile
      - name: Test Promptfoo provider and deterministic assertions
        run: pnpm test:promptfoo
      - name: Run offline Promptfoo retrieval contract
        run: pnpm eval:promptfoo:fixture
      - name: Upload Promptfoo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: promptfoo-rag-results
          path: .work/rag-evals/fixture/promptfoo-report.json
          if-no-files-found: warn

  visual:
    # 擋部署：版面、對比、互動斷言（不比像素，Mac 與 Linux 結果一致，改 UI 不用更新基線）。
    name: Visual regression (required for UI changes)
    needs: ui-scope
    if: needs.ui-scope.outputs.required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright layout assertions (owns its webServer)
        run: pnpm test:visual
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-failures
          path: test-results/
          if-no-files-found: warn

  screenshots:
    # 不擋部署：像素比對只當審稿素材。每次刻意改 UI 都會紅，紅了就看 diff，
    # 確認是預期的改變再跑 visual-baselines.yml 重產 -linux 基線。
    name: Screenshot diff (non-blocking)
    needs: ui-scope
    if: needs.ui-scope.outputs.required == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - name: Compare screenshots against -linux baselines
        run: pnpm test:visual:screenshots
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diff
          path: test-results/
          if-no-files-found: warn
