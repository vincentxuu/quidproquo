name: Quality

on:
  workflow_call:

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify (lint + references + skills-sync + progress)
        run: pnpm verify

  rag-eval:
    name: Promptfoo RAG contract (non-blocking)
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir evals/rag install --frozen-lockfile
      - name: Test Promptfoo provider and deterministic assertions
        run: pnpm test:promptfoo
      - name: Run offline Promptfoo retrieval contract
        run: pnpm eval:promptfoo:fixture
      - name: Upload Promptfoo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: promptfoo-rag-results
          path: .work/rag-evals/fixture/promptfoo-report.json
          if-no-files-found: warn

  visual:
    name: Visual regression (non-blocking)
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - name: Run Playwright visual tests (owns its webServer)
        run: pnpm test:visual
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diff
          # snapshots 目錄一起帶走：缺 -linux 基線時 Playwright 會把實際圖寫進去，
          # 人眼看過後直接 commit 成基線（linux 基線只能來自 CI，見 playwright.config.ts）。
          path: |
            test-results/
            tests/visual/**/*-snapshots/
          if-no-files-found: warn
