id: daily-digest
name: Daily Digest Pipeline
version: 1
description: >
  Orchestrate daily content generation through the agent-flow pipeline.
  Stage 1 routines (arxiv, github, model-card, security, benchmark, framework, tool, funding, pricing)
  run in parallel; stage 2 (signals) synthesises stage 1 outputs; stage 3 (report) assembles the daily post.
  Mirrors the existing Claude Code skill routines but executes inside the flow runtime
  with D1 tracking, budget enforcement, and artifact versioning.

inputs:
  date:
    type: string
    required: false
    description: Target date in YYYY-MM-DD format (defaults to today)
  language:
    type: string
    required: false
    default: zh-TW
    description: Language for generated content
  stage1Only:
    type: boolean
    required: false
    default: false
    description: Stop after stage 1 parallel routines (skip signals + report)

steps:
  # ── Stage 1: parallel source scans ────────────────────────────────────────
  stage1-parallel:
    kind: parallel
    merge: all
    branches:
      - id: scan-arxiv
        type: agent
        prompt: >
          Scan arxiv cs.AI/cs.CL/cs.MA for today's papers relevant to AI Agents.
          Return structured JSON with paper title, authors, abstract summary, relevance score.
        model: openrouter/qwen/qwen3.8-27b
        maxTokens: 2000
      - id: scan-github
        type: agent
        prompt: >
          Scan GitHub Trending for AI/Agent repos and notable framework releases.
          Return structured JSON with repo name, stars, description, why it matters.
        model: openrouter/qwen/qwen3.8-27b
        maxTokens: 2000
      - id: scan-model-card
        type: agent
        prompt: >
          Detect newly announced AI models in the last 24 hours.
          Return structured JSON with model name, provider, key capabilities, pricing if available.
          Return empty array if no new model detected.
        model: openrouter/qwen/qwen3.8-27b
        maxTokens: 1500
      - id: scan-security
        type: agent
        prompt: >
          Scan for AI security incidents, vulnerabilities, and advisories in the last 24 hours.
          Return structured JSON with incident summary, severity, affected systems.
          Return empty array if no significant incident.
        model: openrouter/qwen/qwen3.8-27b
        maxTokens: 1500
      - id: scan-benchmark
        type: agent
        prompt: >
          Check for leaderboard shifts on major AI benchmarks (SWE-bench, Arena, MMLU, etc).
          Return structured JSON with benchmark name, old leader, new leader, score delta.
          Return empty array if no ranking change detected.
        model: openrouter/qwen/qwen3.8-27b
        maxTokens: 1200
      - id: scan-framework
        type: agent
        prompt: >
          Detect important AI Agent framework releases (LangChain, CrewAI, Agents SDK, etc) in the last 24 hours.
          Return structured JSON with framework, version, key changes.
          Return empty array if no important release.
        model: openrouter/qwen/qwen3.8-27b
        maxTokens: 1200
      - id: scan-tool
        type: agent
        prompt: >
          Find noteworthy new AI developer tools or MCP servers released in the last 24 hours.
          Return structured JSON with tool name, what it does, why it matters.
          Return empty array if nothing noteworthy.
        model: openrouter/qwen/qwen3.8-27b
        maxTokens: 1200
      - id: scan-funding
        type: agent
        prompt: >
          Detect AI/Agent startup funding rounds (Series A+) announced in the last 24 hours.
          Return structured JSON with company, round, amount, investors, what they do.
          Return empty array if no qualifying funding.
        model: openrouter/qwen/qwen3.8-27b
        maxTokens: 1200
      - id: scan-pricing
        type: agent
        prompt: >
          Track AI API pricing changes or sunset announcements in the last 24 hours.
          Return structured JSON with provider, model, old price, new price, effective date.
          Return empty array if no pricing change.
        model: openrouter/qwen/qwen3.8-27b
        maxTokens: 1000

  # ── Stage 2: synthesise signals ───────────────────────────────────────────
  synthesise-signals:
    kind: agent
    prompt: >
      Given the stage 1 scan results, extract cross-cutting signals and themes.
      Identify connections between findings (e.g. a new model + benchmark shift + pricing change).
      Output a signals JSON with themes array and per-source highlight picks.
    model: openrouter/qwen/qwen3.8-27b
    maxTokens: 2500

  # ── Stage 3: assemble daily report ────────────────────────────────────────
  assemble-report:
    kind: agent
    prompt: >
      Using the signals and raw stage 1 data, draft the daily digest report in Markdown.
      Follow the four-circle model: core (Agent), second (AI infra), third (applications/business), fourth (IT management).
      End with a "今天學到什麼" reflection section.
    model: openrouter/qwen/qwen3.8-27b
    maxTokens: 4000

  # ── Quality gate ──────────────────────────────────────────────────────────
  quality-check:
    kind: tool_group
    tools: [run_post_quality_check]
    prompt: Run post quality check on the assembled daily digest draft

  # ── Write draft artifact ──────────────────────────────────────────────────
  write-draft:
    kind: tool_group
    tools: [write_draft_artifact]
    prompt: Write the daily digest draft as a Markdown artifact

  # ── Report artifact ───────────────────────────────────────────────────────
  digest-report:
    kind: artifact
    artifactKind: json_report

edges:
  - from: stage1-parallel
    to: synthesise-signals
  - from: synthesise-signals
    to: assemble-report
  - from: assemble-report
    to: quality-check
  - from: quality-check
    to: write-draft
  - from: write-draft
    to: digest-report

artifacts:
  - id: daily-digest-draft
    kind: markdown_draft
    title: Daily digest draft
    stepId: write-draft
  - id: daily-digest-report
    kind: json_report
    title: Daily digest pipeline report
    stepId: digest-report

budget:
  maxRetries: 1
  maxRuntimeMs: 600000
  maxExternalCalls: 18
